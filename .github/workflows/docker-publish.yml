name: Publish Docker IO image

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/docker-publish.yml"
      - "datacollectors/**"
      - "factory/feeds.yaml"
      - "nlp/**"
      - "pybeansack/**"
      - "pycupboard/**"
      - "utils/**"
      - "workers/**"
      - "DockerfileIO"
      - ".dockerignore"
      - "requirements-io.txt"
      - "run.py"
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: soumitsr/coffeemaker

jobs:
  build-and-push:
    name: Build and push IO image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set image tag date
        id: meta
        run: echo "date=$(date -u +%y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: DockerfileIO
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:io-${{ steps.meta.outputs.date }}
            ${{ env.IMAGE_NAME }}:io
          cache-from: type=gha,scope=io
          cache-to: type=gha,mode=max,scope=io
