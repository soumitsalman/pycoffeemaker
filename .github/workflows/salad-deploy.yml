name: Publish Docker images

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/salad-deploy.yml"
      - "datacollectors/**"
      - "factory/feeds.yaml"
      - "nlp/**"
      - "pybeansack/**"
      - "pycupboard/**"
      - "utils/**"
      - "workers/**"
      - "DockerfileIO"
      - ".dockerignore"
      - "requirements-io.txt"
      - "run.py"
      - "run_pipelines.sh"
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: soumitsr/coffeemaker

jobs:
  set-meta:
    name: Set image metadata
    runs-on: ubuntu-latest
    outputs:
      date: ${{ steps.meta.outputs.date }}
    steps:
      - name: Set image tag date
        id: meta
        run: echo "date=$(date -u +%y%m%d)" >> "$GITHUB_OUTPUT"

  build-and-push-io:
    name: Build and push IO image
    needs: set-meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push IO image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: DockerfileIO
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:io-${{ needs.set-meta.outputs.date }}
            ${{ env.IMAGE_NAME }}:io
          cache-from: type=gha,scope=io
          cache-to: type=gha,mode=max,scope=io

  build-and-push-gpu:
    name: Build and push GPU image
    needs: set-meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push GPU image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: DockerfileGPU
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:gpu-${{ needs.set-meta.outputs.date }}
            ${{ env.IMAGE_NAME }}:gpu
          cache-from: type=gha,scope=gpu
          cache-to: type=gha,mode=max,scope=gpu

  update-collector:
    name: Update Salad collector
    needs: [set-meta, build-and-push-io]
    runs-on: ubuntu-latest
    steps:
      - name: Update Salad collector
        env:
          SALAD_API_KEY: ${{ secrets.SALAD_API_KEY }}
          IMAGE: docker.io/${{ env.IMAGE_NAME }}:io-${{ needs.set-meta.outputs.date }}
        run: |
          curl -fsS -X PATCH \
            "https://api.salad.com/api/public/organizations/project-cafecito/projects/coffeemaker/containers/coffeemaker-collector-g2" \
            -H "Content-Type: application/merge-patch+json" \
            -H "Salad-Api-Key: ${{ secrets.SALAD_API_KEY }}" \
            -d @- <<EOF
          {
            "container": { "image": "${IMAGE}" }
          }
          EOF

  update-bean-indexer:
    name: Update Salad bean indexer
    needs: [set-meta, build-and-push-gpu]
    runs-on: ubuntu-latest
    steps:
      - name: Update Salad bean indexer
        env:
          SALAD_API_KEY: ${{ secrets.SALAD_API_KEY }}
          IMAGE: docker.io/${{ env.IMAGE_NAME }}:gpu-${{ needs.set-meta.outputs.date }}
        run: |
          curl -fsS -X PATCH \
            "https://api.salad.com/api/public/organizations/project-cafecito/projects/coffeemaker/containers/coffeemaker-bean-indexer-g2" \
            -H "Content-Type: application/merge-patch+json" \
            -H "Salad-Api-Key: ${{ secrets.SALAD_API_KEY }}" \
            --data-binary @- <<EOF
          {
            "container": { "image": "${IMAGE}" }
          }
          EOF

  update-porter:
    name: Update Salad porter
    needs: [set-meta, build-and-push-io]
    runs-on: ubuntu-latest
    steps:
      - name: Update Salad porter
        env:
          SALAD_API_KEY: ${{ secrets.SALAD_API_KEY }}
          IMAGE: docker.io/${{ env.IMAGE_NAME }}:io-${{ needs.set-meta.outputs.date }}
        run: |
          curl -fsS -X PATCH \
            "https://api.salad.com/api/public/organizations/project-cafecito/projects/coffeemaker/containers/coffeemaker-porter-g2" \
            -H "Content-Type: application/merge-patch+json" \
            -H "Salad-Api-Key: ${{ secrets.SALAD_API_KEY }}" \
            --data-binary @- <<EOF
          {
            "container": { "image": "${IMAGE}" }
          }
          EOF
