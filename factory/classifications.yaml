# 24 broad subject categories for content embeddings.
# Classify by the central subject, irrespective of news/blog/paper/report format.
# Descriptions are positive semantic anchors, not classifier instructions.
# Prefer a subject-specific category when a company, politician, country, or tool
# is incidental. Mixed-subject documents can legitimately match multiple topics.
# Editorial boundaries (comments are not embedded):
# - AI systems -> AI; software and data pipelines -> software/data engineering.
# - Digital infrastructure/components -> computing infrastructure; finished devices/robots -> consumer electronics/robotics.
# - Attacks, privacy, and protection -> cybersecurity; industrial production -> industry/manufacturing.
# - Government and geopolitics -> politics/global affairs; courts and incidents -> law/public safety.
# - Civil liberties, migration, and social patterns -> civil rights/migration/society.
# - Clinical, population, and mental health plus everyday fitness -> health/wellness.
# - Biological mechanisms -> biology; physics, chemistry, materials, and math -> physical sciences.
# - Earth, space, climate, environment, energy, resources, and hazards -> Earth/climate/environment.
# - Food production -> agriculture; meals and trip experiences -> food/dining/travel.
# - Competitive sport and leisure hobbies -> sports/recreation; creative works and media -> arts/culture/media.
# - Buildings and property -> construction/housing; domestic life and pets -> home/family.
categories:
- id: Artificial Intelligence
  description: >-
    Artificial intelligence and machine learning systems that learn, predict, classify,
    reason, or generate content. Covers language models, computer vision, speech recognition,
    generative media, agents, model training and evaluation, AI products, and AI safety.
- id: Software and Data Engineering
  description: >-
    Designing, building, and maintaining software and data systems. Covers programming
    languages, APIs, applications, operating systems, developer tools, databases, SQL,
    data warehouses, ETL, streaming, analytics, data quality, testing, and software architecture.
- id: Computing Infrastructure and Hardware
  description: >-
    The computing equipment and infrastructure that power digital services and networks.
    Covers processors, semiconductors, memory, storage, servers, data centers, cloud platforms,
    distributed systems, containers, broadband, mobile networks, internet routing, and reliability.
- id: Cybersecurity and Privacy
  description: >-
    Protecting digital systems, networks, accounts, and personal information from threats
    and misuse. Covers hacking, malware, ransomware, phishing, vulnerabilities, authentication,
    encryption, security operations, breach response, surveillance, privacy engineering,
    and safeguards against unauthorized access or data exposure.
- id: Consumer Electronics and Robotics
  description: >-
    Finished personal electronic devices and robots used by consumers or organizations.
    Covers phones, computers, wearables, cameras, smart-home devices, autonomous robots,
    drones, product releases, reviews, repairs, robot control, and real-world deployment.
- id: Industry and Manufacturing
  description: >-
    The design and production of physical goods and industrial systems. Covers engineering,
    machinery, automation, factory operations, fabrication, machining, additive manufacturing,
    production lines, quality control, maintenance, and process improvement.
- id: Economics, Accounting and Finance
  description: >-
    Economies, financial reporting, capital markets, and financial services. Covers growth,
    inflation, monetary and fiscal policy, taxes, accounting, audits, stocks, bonds, investing,
    banking, credit, insurance, payments, and personal money management.
- id: Business Marketing and Employment
  description: >-
    How organizations are created, managed, marketed, and staffed. Covers startups, strategy,
    venture funding, mergers, leadership, company performance, branding, advertising, sales,
    hiring, careers, wages, workplace conditions, unions, and labor relations.
- id: Politics and Global Affairs
  description: >-
    Political power and relations among governments and international institutions. Covers
    elections, parties, public administration, legislation, diplomacy, foreign policy, treaties,
    alliances, trade negotiations, sanctions, geopolitical disputes, armed forces, defense,
    and international conflict.
- id: Law, Crime and Public Safety
  description: >-
    Legal rules, justice systems, criminal activity, and community safety. Covers courts,
    lawsuits, trials, contracts, judgments, police investigations, arrests, fraud, violent crime,
    emergency responses, crime prevention, and public safety alerts.
- id: Civil Rights, Migration and Society
  description: >-
    How people and communities experience rights, identity, inequality, and social change.
    Covers civil liberties, discrimination, human rights, poverty, protest, migration, visas,
    asylum, refugees, citizenship, demographics, sociology, anthropology, and cultural traditions.
- id: Health and Wellness
  description: >-
    Human health, medical care, psychological wellbeing, and personal health practices.
    Covers disease, diagnosis, treatment, clinical research, public health, hospitals, care access,
    mental health, therapy, exercise, nutrition, sleep, and physical wellbeing.
- id: Biology and Biotechnology
  description: >-
    Living organisms and biological mechanisms, from molecules and cells to ecosystems.
    Covers genetics, genomics, microbiology, physiology, evolution, bioinformatics, synthetic
    biology, laboratory methods, engineered organisms, and biological manufacturing.
- id: Physical Sciences and Mathematics
  description: >-
    Physical and chemical properties of matter and energy, and mathematical methods for
    describing them. Covers physics, chemistry, materials science, particles, forces, reactions,
    polymers, nanomaterials, algebra, geometry, statistics, probability, and mathematical modeling.
- id: Earth, Space, Climate and Environment
  description: >-
    Earth's physical systems, space, climate, and the natural environment. Covers geology,
    oceans, weather, astronomy, space exploration, climate change, conservation, biodiversity,
    pollution, energy systems, mineral resources, natural hazards, disasters, and recovery.
- id: Agriculture and Food Production
  description: >-
    Growing crops, raising animals, and producing food or agricultural materials. Covers
    farming, agronomy, soil, irrigation, fertilizers, pests, harvests, livestock, fisheries,
    aquaculture, forestry, farm equipment, food processing, and agricultural policy.
- id: Transportation and Logistics
  description: >-
    Moving people and goods by road, rail, air, and water. Covers cars, electric vehicles,
    public transit, airlines, passenger safety, freight, shipping, ports, warehousing, procurement,
    delivery, supply chains, and transportation operations.
- id: Construction, Housing and Real Estate
  description: >-
    Designing, building, maintaining, owning, and occupying buildings and physical places.
    Covers architecture, civil engineering, construction, roads, bridges, urban planning,
    property markets, rents, mortgages, housing supply, affordability, landlords, and tenants.
- id: Education and Humanities
  description: >-
    Teaching, learning, and the study of human history, ideas, and beliefs. Covers schools,
    universities, curricula, pedagogy, admissions, educational policy, historical events,
    archaeology, cultural heritage, philosophy, ethics, religion, and spiritual traditions.
- id: Sports and Recreation
  description: >-
    Competitive sports and recreational activities pursued for enjoyment. Covers athletes,
    teams, leagues, tournaments, esports, video games, tabletop games, crafts, outdoor hobbies,
    hiking, camping, fishing, game releases, sporting results, and recreation equipment.
- id: Arts, Culture, Media and Entertainment
  description: >-
    Creative works, entertainment, public personalities, and the media through which culture
    circulates. Covers film, television, music, books, visual arts, design, theater, journalism,
    publishing, celebrities, creators, social platforms, online communities, and media criticism.
- id: Food, Dining and Travel
  description: >-
    Food and drink experiences and leisure travel. Covers recipes, cooking, ingredients,
    restaurants, cafes, cuisines, chefs, dining reviews, hotels, destinations, sightseeing,
    itineraries, tours, cruises, and tourism advice.
- id: Fashion, Beauty and Consumer Affairs
  description: >-
    Personal appearance and consumer purchasing. Covers clothing, fashion, styling, cosmetics,
    skincare, grooming, stores, online shopping, sales, product quality, pricing, returns,
    warranties, recalls, and consumer protection.
- id: Home, Family and Pets
  description: >-
    Domestic life, household spaces, close relationships, and companion animals. Covers home
    improvement, decorating, cleaning, gardening, parenting, family dynamics, caregiving,
    dating, friendship, eldercare, pet health, training, adoption, and responsible pet care.

sentiments:
- id: highly positive
  description: Strongly positive emotional or evaluative tone, such as exuberant celebration, emphatic praise, major success, or unusually favorable outcomes. Use only when positive language or reaction is intense; ordinary approval or good news is positive.
- id: positive
  description: Favorable, approving, appreciative, constructive, or optimistic tone without strong emotional intensity. Use for praise, gains, successful outcomes, encouragement, and pleasant observations that are clearly positive but not emphatic.
- id: neutral
  description: Factual, explanatory, analytical, or balanced presentation without a clear positive or negative emotional stance. Use for routine reporting and measured discussion; seriousness, controversy, or importance alone does not make sentiment non-neutral.
- id: negative
  description: Unfavorable, critical, disappointed, or pessimistic tone describing a poor outcome, loss, setback, harm, or deteriorating condition. Use when the negative judgment is clear but not strongly emotional or emphatic.
- id: highly negative
  description: Strongly negative emotional or evaluative tone, including intense condemnation, outrage, despair, alarm, or severe descriptions of harm and failure. Use only when the language or reaction is markedly more intense than ordinary criticism or bad news.
ideologies:
- id: left
  description: Clearly left-wing political direction, including progressive, liberal, social-democratic, democratic-socialist, labor-left, redistributive, environmentalist-left, racial-justice, gender-equality, LGBTQ-rights, immigrant-rights, universal-public-services, or government-intervention framing. Use when the content advocates, advances, celebrates, or is organized around left-wing political positions, candidates, parties, movements, or policy goals. Do not infer this label solely from the subject being a left-wing politician or from neutral reporting about a progressive policy dispute.
- id: right
  description: Clearly right-wing political direction, including conservative, right-of-center, nationalist, populist-right, libertarian-right, traditionalist, law-and-order, free-market, limited-government, anti-tax, anti-regulation, border-restriction, social-conservative, or religious-conservative framing. Use when the content advocates, advances, celebrates, or is organized around right-wing political positions, candidates, parties, movements, or policy goals. Do not infer this label solely from the subject being a right-wing politician or from neutral reporting about a conservative policy dispute.
- id: center
  description: Explicitly centrist, moderate, bipartisan, nonpartisan, or pragmatic middle-ground political direction. Use when the content advocates compromise or cross-party agreement, or supports a clearly centrist policy position. Balanced reporting that does not endorse a political direction is undetermined, not center.
- id: undetermined
  description: Use when content is non-political or its political direction cannot be responsibly determined. This includes factual or descriptive reporting without advocacy, political-adjacent topics without a clear endorsed position, and ambiguous, mixed, satirical, incomplete, or context-poor content. Do not infer ideology from a topic, person, outlet, country, demographic group, or isolated keywords.
