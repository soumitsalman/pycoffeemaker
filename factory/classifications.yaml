# 24 broad subject categories for content embeddings.
# factory/setup.py embeds only `description`, as:
#   Instruct: Identify the main and secondary category of the given article based on the title and abstract.
#   Query: {description}
# Sentiments use "Classify the sentiment of the given text."
# Ideologies use "Classify the political ideology of the given text."
# Documents are embedded as raw passages (F2LLM-v2-80M). Nearest cosine label wins.
# Write each description as a concrete passage prototype: headline nouns the right
# articles actually use. Comments are not embedded.
# Do not put out-of-scope topics in a description. Negated counterexamples still
# attract those passages.
# Editorial boundaries:
# - AI systems -> AI; apps, operating systems, and data pipelines -> software/data engineering.
# - Chips, GPUs, graphics APIs, servers, networks -> computing infrastructure.
# - Finished gadgets, including sale prices, preorders, and gift cards -> consumer electronics.
# - Malware, phishing, breaches, passwords -> cybersecurity. Home cameras are gadgets.
# - Factory production -> industry. Race cars, bikes, and championships -> sports.
# - Markets, inflation, banks, asset prices -> economics. A sticker price is not finance.
# - Elections, offices, diplomacy, wars, military strikes, and battlefield casualties -> politics.
# - Courts, police, and criminal cases -> law. A stroke or hospital stay -> health.
# - Clothing and cosmetics -> fashion. Recipes and trips -> food/dining/travel.
categories:
- id: Artificial Intelligence
  description: >-
    Language models and chatbots. Prompts, tokens, model benchmarks, AI agents, coding
    assistants, Copilot, Gemini, Claude, and GPT.
- id: Software and Data Engineering
  description: >-
    Software bug fixes and releases. Windows, browsers, Android, Outlook, VPN client
    updates, server software, source code, APIs, and developer tools.
- id: Computing Infrastructure and Hardware
  description: >-
    Computing hardware and digital infrastructure. Processors, semiconductors, GPUs,
    graphics cards, VRAM, ray tracing, DirectX, memory, storage, servers, data centers,
    cloud platforms, broadband, and mobile networks. GPUs, VRAM, ray tracing, DirectX,
    semiconductors, data centers, and fiber networks.
- id: Cybersecurity and Privacy
  description: >-
    Data breaches, phishing, malware, password theft, and software vulnerabilities that
    attackers exploit. Stolen passwords, phishing emails, ransomware, account hijacking,
    and exchange hacks.
- id: Consumer Electronics and Robotics
  description: >-
    Consumer electronics. Smartphones, laptops, tablets, tablet batteries, headphones,
    earbuds, OLED televisions, 4K TVs, soundbars, smartwatches, mirrorless cameras,
    turntables, e-readers, portable chargers, home security cameras, robot vacuums,
    device preorders, trade-ins, gift cards on phones and laptops, hi-fi turntables,
    record players, mirrorless cameras, guitar amplifiers, tablet battery capacity, and
    security cameras. XR glasses, gaming monitors, Fire TV sticks, robot vacuums, travel
    routers, Garmin watches, mirrorless cameras, OLED MacBook preorders, and gift cards.
- id: Industry and Manufacturing
  description: >-
    Factory production and industrial manufacturing. CNC mills, injection molding,
    welders, fabrication shops, additive manufacturing, plant maintenance, and quality
    control on a mass-production line.
- id: Economics, Accounting and Finance
  description: >-
    Inflation, interest rates, central banks, stocks, bonds, ETFs, Bitcoin prices,
    cryptocurrency exchanges, and banking. Cryptocurrency prices, ETFs, stock markets,
    and banking.
- id: Business Marketing and Employment
  description: >-
    Companies cutting jobs, hiring workers, executive strategy, and advertising
    campaigns.
- id: Politics and Global Affairs
  description: >-
    Elections, governments, and wars. Senators, midterms, diplomacy, sanctions, armed
    forces, airstrikes, and military drone strikes. Elections, midterms, senators, wars,
    military drone strikes, and armed forces.
- id: Law, Crime and Public Safety
  description: >-
    Police, courts, and crime. Arrests, trials, lawsuits, verdicts, stabbings, raids,
    and criminal charges. Law, Crime and Public Safety. Lawsuits, criminal trials,
    police raids, stabbings, arrests, and courtroom verdicts.
- id: Civil Rights, Migration and Society
  description: >-
    Civil rights, migration, and social inequality. Discrimination, human rights,
    protests, visas, asylum, refugees, citizenship, immigration rules, poverty, and
    demographic change.
- id: Health and Wellness
  description: >-
    Hospitals, illness, and fitness. Strokes, vaccines, cancer treatment, surgery,
    exercise, sleep, and recovery.
- id: Biology and Biotechnology
  description: >-
    Biology and biotechnology. Cells, genes, genomes, microbes, physiology, evolution,
    bioinformatics, synthetic biology, laboratory organisms, and biological
    manufacturing.
- id: Physical Sciences and Mathematics
  description: >-
    Materials science, chemical reactions, polymers, and physics demonstrations.
- id: Earth, Space, Climate and Environment
  description: >-
    Climate change, global warming, spaceflight, spaceplanes, astronomy, and natural
    disasters.
- id: Agriculture and Food Production
  description: >-
    Crop harvests, livestock, fertilizers, and farms.
- id: Transportation and Logistics
  description: >-
    Vehicles and transit. Cars, electric vehicles, motorcycles, e-bikes, ferries,
    airlines, and freight.
- id: Construction, Housing and Real Estate
  description: >-
    Buildings, construction, and property. Architecture, skyscrapers, bridges, housing
    construction, rents, mortgages, landlords, tenants, and home affordability.
- id: Education and Humanities
  description: >-
    University exams, homework, admissions, and classroom teaching.
- id: Sports and Recreation
  description: >-
    Sports results and recreational games. Formula 1, Grand Prix, world champions,
    racing drivers, football, tennis tournaments, Olympic athletes, video games,
    PlayStation games, Xbox games, puzzle games, game consoles, cricket squads, ODI
    series, and fast bowlers. Formula 1, Grand Prix, football, cricket, AllTrails,
    PlayStation Plus, World of Warcraft, Diablo, and Steam games.
- id: Arts, Culture, Media and Entertainment
  description: >-
    Movies, television, music, books, and celebrities. Films, series, actors, albums,
    novels, theater, journalism about entertainment, and media criticism. Movies,
    television series, Netflix, actors, concerts, and entertainment news.
- id: Food, Dining and Travel
  description: >-
    Espresso machines, drip coffee makers, chefs, and vacation travel. Espresso
    machines, coffee makers, camping trips, and restaurants.
- id: Fashion, Beauty and Consumer Affairs
  description: >-
    Clothing, outfits, what to wear, skincare, and wardrobe styling.
- id: Home, Family and Pets
  description: >-
    Parenting, pets, family routines, decorating, and living in a tiny house.

sentiments:
- id: highly positive
  description: Strongly positive emotional or evaluative tone, such as exuberant celebration, emphatic praise, major success, or unusually favorable outcomes. Use only when positive language or reaction is intense; ordinary approval or good news is positive.
- id: positive
  description: Favorable, approving, appreciative, constructive, or optimistic tone without strong emotional intensity. Use for praise, gains, successful outcomes, encouragement, and pleasant observations that are clearly positive but not emphatic.
- id: neutral
  description: Factual, explanatory, analytical, or balanced presentation without a clear positive or negative emotional stance. Use for routine reporting and measured discussion; seriousness, controversy, or importance alone does not make sentiment non-neutral.
- id: negative
  description: Unfavorable, critical, disappointed, or pessimistic tone describing a poor outcome, loss, setback, harm, or deteriorating condition. Use when the negative judgment is clear but not strongly emotional or emphatic.
- id: highly negative
  description: Strongly negative emotional or evaluative tone, including intense condemnation, outrage, despair, alarm, or severe descriptions of harm and failure. Use only when the language or reaction is markedly more intense than ordinary criticism or bad news.

ideologies:
- id: left
  description: Clearly left-wing political direction, including progressive, liberal, social-democratic, democratic-socialist, labor-left, redistributive, environmentalist-left, racial-justice, gender-equality, LGBTQ-rights, immigrant-rights, universal-public-services, or government-intervention framing. Use when the content advocates, advances, celebrates, or is organized around left-wing political positions, candidates, parties, movements, or policy goals. Do not infer this label solely from the subject being a left-wing politician or from neutral reporting about a progressive policy dispute.
- id: right
  description: Clearly right-wing political direction, including conservative, right-of-center, nationalist, populist-right, libertarian-right, traditionalist, law-and-order, free-market, limited-government, anti-tax, anti-regulation, border-restriction, social-conservative, or religious-conservative framing. Use when the content advocates, advances, celebrates, or is organized around right-wing political positions, candidates, parties, movements, or policy goals. Do not infer this label solely from the subject being a right-wing politician or from neutral reporting about a conservative policy dispute.
- id: center
  description: Explicitly centrist, moderate, bipartisan, nonpartisan, or pragmatic middle-ground political direction. Use when the content advocates compromise or cross-party agreement, or supports a clearly centrist policy position. Balanced reporting that does not endorse a political direction is undetermined, not center.
- id: undetermined
  description: Non-political or undeterminable political direction. Includes factual or descriptive reporting without advocacy, political-adjacent topics without a clear endorsed position, and ambiguous, mixed, satirical, incomplete, or context-poor content. Avoid ideology inference from person, outlet, country, demographic group, or isolated keywords.
