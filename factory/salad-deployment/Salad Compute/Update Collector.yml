info:
  name: Update Collector
  type: http
  seq: 5

http:
  method: PATCH
  url: https://api.salad.com/api/public/organizations/project-cafecito/projects/coffeemaker/containers/coffeemaker-collector-g2
  headers:
    - name: Content-Type
      value: application/merge-patch+json
  body:
    type: text
    data: |-
      {
        "container": {
          "command": ["--collector", "64"],
          "environment_variables": {                
            "COLLECTOR_TIMEOUT": "180",
            "COMPLETION_WEBHOOK_URL": "https://api.salad.com/api/public/organizations/project-cafecito/projects/coffeemaker/containers/coffeemaker-collector-g2/stop",
            "COMPLETION_WEBHOOK_API_KEY": "Salad-Api-Key:{{apiKey}}"              
          },
          "image": "{{IMAGE}}",
          "resources": {
            "cpu": 1,
            "memory": 4096,
          }
        },
        "replicas": 1
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
