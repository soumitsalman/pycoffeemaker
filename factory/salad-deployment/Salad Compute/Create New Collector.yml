info:
  name: Create New Collector
  type: http
  seq: 1

http:
  method: POST
  url: https://api.salad.com/api/public/organizations/project-cafecito/projects/coffeemaker/containers
  body:
    type: json
    data: |-
      {
        "name": "coffeemaker-collector-g2",
        "autostart_policy": false,
        "container": {
          "command": [],
          "environment_variables": {
            "PROCESSING_CACHE": {{PROCESSING_CACHE}},
            "MODE": "COLLECTOR",
            "BATCH_SIZE": "64",
            "COLLECTOR_TIMEOUT": "180",
            "REDDIT_SESSION_COOKIE": {{REDDIT_SESSION_COOKIE}}
          },
          "image": "docker.io/soumitsr/coffeemaker:io-latest",
          "image_caching": true,
          "logging": null,
          "priority": "batch",
          "registry_authentication": null,
          "resources": {
            "cpu": 1,
            "gpu_classes": [],
            "memory": 4096,
            "shm_size": 64
          }
        },
        "queue_connection": null,
        "queue_autoscaler": null,
        "liveness_probe": null,
        "networking": null,
        "readiness_probe": null,
        "replicas": 1,
        "restart_policy": "never",
        "startup_probe": null,
        "scaling_actions": [],
        "scheduled_scaling_enabled": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
