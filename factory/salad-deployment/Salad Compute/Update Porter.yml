info:
  name: Update Porter
  type: http
  seq: 6

http:
  method: PATCH
  url: https://api.salad.com/api/public/organizations/project-cafecito/projects/coffeemaker/containers/coffeemaker-porter-g2
  headers:
    - name: Content-Type
      value: application/merge-patch+json
  body:
    type: text
    data: |-
      {
        "container": {
              "command": ["--porter", "512"],
              "environment_variables": {                
                "PG_WORKERS": "8",
                "PROCESSING_WINDOW": "7",
                "COMPLETION_WEBHOOK_URL": "https://api.salad.com/api/public/organizations/project-cafecito/projects/coffeemaker/containers/coffeemaker-porter-g2/stop",
                "COMPLETION_WEBHOOK_API_KEY": "Salad-Api-Key:{{apiKey}}"
              },
              "image": "{{IMAGE}}",
              "resources": {
                "cpu": 1,
                "memory": 4096,
              }      
            },
            "replicas": 1
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
